<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Road Trip · España–Francia · La Aventura</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap');

  :root{
    --gold-1:#e9c46a; --gold-2:#c8963e; --gold-3:#8a5a2b;
    --parch-1:#f6e7c4; --parch-2:#ecd5a3;
    --ink:#4a3418; --red:#c0432c; --red-dark:#9b2f1c; --green:#7fa650;
    --shadow: 0 10px 30px rgba(60,35,10,.35);
    --inv: 1;              /* inverso de la escala (para pines) */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none;}
  body{
    font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background:#6f584a;
    -webkit-user-select:none; user-select:none;
  }

  /* ===================== MAPA PAN/ZOOM ===================== */
  #viewport{
    position:fixed; inset:0; overflow:hidden;
    touch-action:none; cursor:grab;
    background:radial-gradient(120% 120% at 50% 30%, #caa46f, #8a6a4c 70%, #6f584a);
  }
  #viewport.grabbing{cursor:grabbing;}
  #world{
    position:absolute; top:0; left:0;
    transform-origin:0 0; will-change:transform;
    width:1024px; height:1280px;   /* se ajusta al cargar el mapa */
  }
  #world img.map{width:100%; height:100%; display:block; pointer-events:none;}
  /* fondo mientras no hay mapa */
  #world.nomap{
    background:
      repeating-linear-gradient(45deg,#efdcb2 0 40px,#e8d0a0 40px 80px);
    display:flex; align-items:center; justify-content:center;
  }
  #world.nomap::after{
    content:"🗺️  Guarda tu mapa como  img/mapa.png";
    font-size:34px; color:#7a5228; background:rgba(255,247,225,.85);
    padding:18px 26px; border-radius:16px; border:3px dashed #b98a3e; text-align:center;
  }

  /* Chinchetas (viven dentro de #world, se contra-escalan) */
  .pin{position:absolute; z-index:5;}
  .pin .marker{
    transform:translate(-50%,-100%) scale(var(--inv));
    transform-origin:50% 100%;
    display:flex; flex-direction:column; align-items:center; cursor:pointer;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));
    transition:filter .15s;
  }
  .pin .head{
    width:40px; height:40px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:radial-gradient(circle at 35% 30%, #ff7a5c, var(--red) 60%, var(--red-dark));
    border:3px solid #fff2d8; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .pin .num{transform:rotate(45deg); color:#fff; font-weight:700; font-size:17px;}
  .pin .tag{
    margin-top:5px; background:var(--ink); color:#fff3d6; font-size:13px; font-weight:600;
    padding:2px 9px; border-radius:9px; white-space:nowrap; box-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  .pin .head::before{
    content:""; position:absolute; inset:-7px; border-radius:inherit;
    border:3px solid rgba(255,255,255,.75); animation:pulse 2s infinite ease-out;
  }
  @keyframes pulse{0%{transform:scale(.7); opacity:.9;} 100%{transform:scale(1.9); opacity:0;}}
  .pin.visited .head{background:radial-gradient(circle at 35% 30%,#b7d98a,var(--green) 60%,#5f7f38);}
  .pin.visited .head::before{display:none;}
  .pin .marker:hover{filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));}

  /* ===================== OVERLAYS FIJOS ===================== */
  .hud{position:fixed; z-index:20; pointer-events:none;}
  .hud > *{pointer-events:auto;}

  /* Banner + party arriba-izquierda */
  .topleft{top:clamp(10px,2vw,20px); left:clamp(10px,2vw,20px); display:flex; flex-direction:column; gap:12px; max-width:min(46vw,420px);}
  .banner{
    background:var(--red); color:#fff8ea; border-radius:14px; padding:8px 16px 10px;
    box-shadow:var(--shadow), inset 0 -5px 0 rgba(0,0,0,.18);
    transform:rotate(-1.2deg); border:3px solid #fff2d8; text-align:center;
  }
  .banner .kicker{font-family:'Caveat',cursive; font-size:clamp(14px,1.9vw,20px); line-height:1; opacity:.95;}
  .banner h1{margin:0; font-weight:700; font-size:clamp(20px,3.2vw,36px); line-height:.95; text-shadow:0 3px 0 var(--red-dark);}
  .banner .flags{font-size:clamp(12px,1.6vw,17px); margin-top:2px;}

  .party{display:flex; gap:clamp(6px,1vw,12px);}
  .hero{
    --sz:clamp(62px,7.8vw,98px); width:var(--sz); height:var(--sz); border-radius:50%;
    background:transparent; overflow:hidden;
    box-shadow:0 6px 16px rgba(60,35,10,.4); cursor:pointer; position:relative;
    display:flex; align-items:flex-end; justify-content:center;
    transition:transform .18s ease;
  }
  .hero:hover,.hero:active{transform:translateY(-4px) scale(1.08);}
  .hero img{width:100%; height:100%; object-fit:cover; object-position:center center;}
  .hero .fallback{font-size:calc(var(--sz)*.5); padding-bottom:4px;}
  .hero::after{
    content:attr(data-name); position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff2d8; font-size:11px; font-weight:600; padding:2px 8px;
    border-radius:10px; white-space:nowrap; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .hero:hover::after{opacity:1;}

  /* Controles arriba-derecha */
  .topright{top:clamp(10px,2vw,20px); right:clamp(10px,2vw,20px); display:flex; flex-direction:column; gap:10px; align-items:center;}
  .tool{
    width:50px; height:50px; border-radius:50%; border:3px solid #fff2d8; background:var(--red);
    color:#fff; font-size:24px; font-weight:700; cursor:pointer; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .tool:active{transform:scale(.94);}
  .tool.sm{width:44px; height:44px; font-size:22px;}

  /* Pista inferior */
  .hint{
    bottom:clamp(10px,2vw,18px); left:50%; transform:translateX(-50%);
    background:rgba(74,52,24,.86); color:#fff3d6; padding:8px 16px; border-radius:20px;
    font-size:clamp(12px,1.5vw,15px); box-shadow:var(--shadow); display:flex; gap:14px; align-items:center;
    transition:opacity .4s;
  }
  .hint b{color:var(--gold-1);}

  /* ===================== MODAL ===================== */
  .overlay{
    position:fixed; inset:0; z-index:50; background:rgba(40,24,8,.55); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:18px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .modal{
    width:min(760px,96vw); max-height:92vh; overflow:hidden;
    background:linear-gradient(#fff8ea,#f4e6c4); border:7px solid var(--gold-2); border-radius:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 0 0 3px #fff5d8;
    transform:scale(.9) translateY(10px); transition:transform .25s cubic-bezier(.2,1.3,.5,1);
    display:flex; flex-direction:column;
  }
  .overlay.open .modal{transform:scale(1) translateY(0);}
  .modal-head{position:relative; padding:16px 54px 14px 22px; background:var(--red); color:#fff7ea; border-bottom:4px solid var(--gold-1);}
  .modal-head .num-badge{display:inline-block; background:#fff2d8; color:var(--red-dark); font-weight:700; border-radius:50%; width:30px; height:30px; line-height:30px; text-align:center; margin-right:8px; font-size:15px;}
  .modal-head h2{margin:0; display:inline; font-size:clamp(20px,3vw,28px); vertical-align:middle;}
  .modal-head .sub{font-size:13px; opacity:.9; margin-top:3px;}
  .close{position:absolute; top:12px; right:14px; width:34px; height:34px; border-radius:50%; border:3px solid #fff2d8; background:var(--red-dark); color:#fff; font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;}
  .modal-body{display:flex; gap:18px; padding:18px 22px 22px; overflow:auto;}
  @media (max-width:560px){.modal-body{flex-direction:column;}}
  .modal-img{flex:0 0 42%; align-self:flex-start; border:5px solid var(--gold-1); border-radius:16px; overflow:hidden; background:var(--parch-2); box-shadow:var(--shadow); min-height:170px; display:flex; align-items:center; justify-content:center;}
  .modal-img img{width:100%; display:block;}
  .modal-img .fb{font-size:70px; padding:30px;}
  .modal-text{flex:1 1 auto; font-size:clamp(14px,1.7vw,16px); line-height:1.5;}
  .modal-text h4{margin:2px 0 6px; color:var(--red-dark); font-size:1.05em; display:flex; align-items:center; gap:7px;}
  .modal-text p{margin:0 0 12px;}
  .likes{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 14px;}
  .chip{background:var(--green); color:#fff; font-size:13px; font-weight:600; padding:4px 11px; border-radius:20px; box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .acts{list-style:none; padding:0; margin:0;}
  .acts li{background:#fff6df; border-left:5px solid var(--gold-2); padding:8px 12px; border-radius:8px; margin-bottom:7px; display:flex; gap:9px; align-items:flex-start;}
  .acts li .ic{font-size:18px;}
  .quote{font-family:'Caveat',cursive; font-size:1.35em; color:var(--red-dark); background:#fff6df; border-radius:12px; padding:8px 14px; margin-top:6px; border:2px dashed var(--gold-2);}

  /* ===================== SPLASH DE BIENVENIDA ===================== */
  .splash{
    position:fixed; inset:0; z-index:80; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(8px,1.6vh,18px); text-align:center; padding:24px;
    background:radial-gradient(130% 130% at 50% 25%, #f6e7c4 0%, #e6c98f 45%, #b98a52 100%);
    transition:opacity .5s ease, transform .5s ease;
  }
  .splash::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.5), transparent 22%),
      radial-gradient(circle at 88% 82%, rgba(150,110,60,.35), transparent 30%);
  }
  .splash.hide{opacity:0; transform:scale(1.06); pointer-events:none;}
  .splash .s-banner{
    position:relative; background:var(--red); color:#fff8ea; border-radius:18px;
    padding:10px 26px 14px; border:4px solid #fff2d8; transform:rotate(-1.5deg);
    box-shadow:var(--shadow), inset 0 -6px 0 rgba(0,0,0,.18);
  }
  .splash .s-banner .k{font-family:'Caveat',cursive; font-size:clamp(18px,3vw,28px); line-height:1;}
  .splash .s-banner h1{margin:0; font-weight:700; font-size:clamp(34px,7vw,68px); line-height:.92; text-shadow:0 4px 0 var(--red-dark);}
  .splash .s-banner .fl{font-size:clamp(15px,2.4vw,22px); margin-top:3px;}
  .splash img.fam{
    max-height:46vh; max-width:min(88vw,520px); position:relative;
    filter:drop-shadow(0 14px 24px rgba(60,35,10,.4));
    animation:floaty 3.5s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}
  .splash .start{
    position:relative; font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:clamp(19px,2.6vw,26px); color:#fff; cursor:pointer;
    background:linear-gradient(#8bbf5b,var(--green)); border:4px solid #fff2d8;
    padding:14px 34px; border-radius:40px;
    box-shadow:var(--shadow), inset 0 -5px 0 rgba(0,0,0,.2);
    animation:beat 1.8s ease-in-out infinite;
  }
  .splash .start:active{transform:translateY(2px);}
  @keyframes beat{0%,100%{transform:scale(1)} 50%{transform:scale(1.05)}}

  /* ===================== PANTALLA DE CARGA ===================== */
  #loading{
    position:fixed; inset:0; z-index:82; display:none;
    flex-direction:column; align-items:center; justify-content:flex-end;
    padding:0 24px clamp(40px,9vh,90px);
    background:#2a1c10 center/cover no-repeat;
    background-image:linear-gradient(to bottom, rgba(20,12,6,.15) 30%, rgba(20,12,6,.72) 100%), url('img/loading.jpg');
    transition:opacity .6s ease;
  }
  #loading.hide{opacity:0; pointer-events:none;}
  #loading .l-inner{width:min(560px,92vw); text-align:center; color:#fff;}
  #loading .l-title{
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(22px,3.4vw,34px);
    text-shadow:0 3px 10px rgba(0,0,0,.6); margin-bottom:6px;
  }
  #loading .l-msg{
    font-family:'Caveat',cursive; font-size:clamp(18px,2.6vw,26px);
    opacity:.95; text-shadow:0 2px 8px rgba(0,0,0,.7); margin-bottom:14px; min-height:1.3em;
  }
  #loading .l-track{
    height:24px; border-radius:14px; overflow:hidden; position:relative;
    background:rgba(255,255,255,.22); border:3px solid #fff2d8;
    box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 2px 5px rgba(0,0,0,.3);
  }
  #loading .l-fill{
    height:100%; width:0%; border-radius:11px;
    background:linear-gradient(90deg,#e9c46a,#8bbf5b 60%,#7fa650);
    box-shadow:0 0 12px rgba(233,196,106,.7); transition:width .12s linear;
    position:relative; overflow:hidden;
  }
  #loading .l-fill::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
    transform:translateX(-100%); animation:shimmer 1.1s linear infinite;
  }
  @keyframes shimmer{to{transform:translateX(100%);}}
  #loading .l-pct{
    margin-top:8px; font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:clamp(15px,1.9vw,19px); text-shadow:0 2px 6px rgba(0,0,0,.6);
  }

  .calib{position:fixed; left:10px; bottom:10px; z-index:60; background:rgba(0,0,0,.78); color:#0f0; font:13px monospace; padding:7px 11px; border-radius:8px; display:none;}
  .calib.on{display:block;}
</style>
</head>
<body>

<!-- ============ SPLASH DE BIENVENIDA ============ -->
<div class="splash" id="splash">
  <div class="s-banner">
    <div class="k">Nuestra gran aventura</div>
    <h1>ROAD TRIP</h1>
    <div class="fl">🇪🇸 España · Francia 🇫🇷</div>
  </div>
  <img class="fam" src="img/familia.png" alt="La familia" onerror="this.style.display='none'">
  <button class="start" id="startBtn">▶︎ ¡Empezar la aventura!</button>
</div>

<!-- ============ PANTALLA DE CARGA ============ -->
<div id="loading">
  <div class="l-inner">
    <div class="l-title">Preparando la aventura…</div>
    <div class="l-msg" id="loadMsg">Desplegando el mapa 🗺️</div>
    <div class="l-track"><div class="l-fill" id="loadFill"></div></div>
    <div class="l-pct" id="loadPct">0%</div>
  </div>
</div>

<!-- ============ MAPA A PANTALLA COMPLETA ============ -->
<div id="viewport">
  <div id="world" class="nomap">
    <img class="map" id="mapImg" alt="Mapa del road trip" style="display:none">
    <!-- pines inyectados por JS -->
  </div>
</div>

<!-- ============ HUD FIJO ============ -->
<div class="hud topleft">
  <div class="banner">
    <div class="kicker">Nuestra gran aventura</div>
    <h1>ROAD TRIP</h1>
    <div class="flags">🇪🇸 España · Francia 🇫🇷</div>
  </div>
  <div class="party" id="party"></div>
</div>

<div class="hud topright">
  <button class="tool" id="zoomIn" title="Acercar">＋</button>
  <button class="tool" id="zoomOut" title="Alejar">－</button>
  <button class="tool sm" id="reset" title="Ver todo">⟲</button>
  <button class="tool sm" id="btnSound" title="Sonido">🔊</button>
  <button class="tool sm" id="btnHelp" title="Ayuda">?</button>
</div>

<div class="hud hint" id="hint">
  <span>🖐️ Arrastra para moverte</span>
  <span>🤏 Pellizca para zoom</span>
  <span>📍 Toca una chincheta</span>
</div>

<!-- ============ MODAL ============ -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head"><button class="close" id="closeBtn" aria-label="Cerrar">✕</button><div id="headContent"></div></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="calib" id="calib"></div>

<script>
/* ======================================================================
   DATOS — edita aquí. Coordenadas de pines en % del mapa.
   Pulsa "C" para calibrar: toca el mapa y te da las coordenadas.
   ====================================================================== */
const PERSONAJES = [
  {id:"mama", nombre:"Mamá", emoji:"🧢", img:"img/mama.png",
   subtitulo:"La copiloto aventurera",
   descripcion:"Descripción de mamá: cómo es, qué se le da bien en los viajes, alguna anécdota...",
   gustos:["Playas","Fotos","Mercados"], frase:"“¡La siguiente parada la elijo yo!”"},
  {id:"nina", nombre:"La peque", emoji:"🎀", img:"img/nina.png",
   subtitulo:"La exploradora curiosa",
   descripcion:"Descripción de la peque: qué le encanta, qué colecciona del viaje, su comida favorita...",
   gustos:["Helados","Arena","Animales"], frase:"“¿Cuánto queda para llegaaar?”"},
  {id:"papa", nombre:"Papá", emoji:"🧭", img:"img/papa.png", foto:"img/papa-cuerpo.png",
   subtitulo:"El capitán del mapa",
   descripcion:"Descripción de papá: lleva el mapa y la mochila, se orienta genial, le gusta...",
   gustos:["Rutas","Montaña","Café"], frase:"“Confía en mí, es un atajo.”"}
];

/* Coordenadas en % ajustadas al mapa ilustrado (Madrid abajo → Bordeaux arriba-dcha).
   Orden del viaje: Madrid, Burgos, Pamplona, San Juan de Luz, Ainhoa, Espelette,
   Hossegor, Capbreton, Dune du Pilat, Bordeaux. */
const PARADAS = [
  {n:1, id:"madrid", nombre:"Madrid", pais:"España 🇪🇸", x:38, y:94, emoji:"👑", img:"img/parada-madrid.png",
   historia:"El punto de salida. Capital de España desde 1561, cuando Felipe II trasladó aquí la corte. Su símbolo, el Palacio Real, es de los más grandes de Europa.",
   actividades:[["🏰","Visitar el Palacio Real y ver el cambio de guardia."],["🚪","La Puerta de Alcalá y el Retiro."],["🍫","Chocolate con churros."]]},
  {n:2, id:"burgos", nombre:"Burgos", pais:"España 🇪🇸", x:41, y:74, emoji:"⛪", img:"img/parada-burgos.png",
   historia:"Su Catedral gótica es Patrimonio de la Humanidad y guarda la tumba del Cid Campeador, el caballero más legendario de España.",
   actividades:[["⛪","Alucinar con las agujas de la Catedral de Burgos."],["🦴","Museo de la Evolución Humana (¡Atapuerca!)."],["🌭","Probar la morcilla de Burgos."]]},
  {n:3, id:"pamplona", nombre:"Pamplona", pais:"España 🇪🇸", x:45, y:66, emoji:"🐂", img:"img/parada-pamplona.png",
   historia:"Fundada por el general romano Pompeyo. Es mundialmente famosa por las fiestas de San Fermín (6–14 de julio) y sus encierros de toros por las calles.",
   actividades:[["🐂","Ver la plaza y las calles del encierro de San Fermín."],["🧱","Pasear por las murallas y el casco viejo."],["🍢","Ir de pintxos por la calle Estafeta."]]},
  {n:4, id:"sanjuan", nombre:"San Juan de Luz", pais:"Francia 🇫🇷", x:42, y:54, emoji:"⛵", img:"img/parada-sanjuan.png",
   historia:"Precioso pueblo pesquero vasco-francés donde se casó el rey Luis XIV en 1660. Su bahía está protegida por diques, así que el mar es tranquilo.",
   actividades:[["🏖️","Bañarse en su playa protegida y calmada."],["🏠","Ver las casas vascas de entramado rojo."],["🍰","Probar el auténtico gâteau basque."]]},
  {n:5, id:"ainhoa", nombre:"Ainhoa", pais:"Francia 🇫🇷", x:50, y:56, emoji:"🏡", img:"img/parada-ainhoa.png",
   historia:"Catalogado como uno de 'Los pueblos más bonitos de Francia'. Es una única calle larga con casas blancas de vigas rojas y verdes de los siglos XVII y XVIII.",
   actividades:[["📸","Fotos entre casas de cuento."],["⛪","Ver su iglesia y el frontón de pelota vasca."],["🚶","Pasear tranquilos, sin coches."]]},
  {n:6, id:"espelette", nombre:"Espelette", pais:"Francia 🇫🇷", x:55, y:60, emoji:"🌶️", img:"img/parada-espelette.png",
   historia:"El pueblo del famoso pimiento. El chile llegó de América en el s.XVI y aquí es oro rojo: en otoño las fachadas se cubren de ristras secándose al sol.",
   actividades:[["🌶️","Fachadas cubiertas de pimientos rojos."],["🛍️","Comprar especias y mermeladas típicas."],["🧀","Queso de oveja con mermelada de cereza negra."]]},
  {n:7, id:"hossegor", nombre:"Hossegor", pais:"Francia 🇫🇷", x:50, y:46, emoji:"🏄", img:"img/parada-hossegor.png",
   historia:"La capital europea del surf: aquí se celebran campeonatos del mundo. Tiene además un lago marino ideal para los más peques.",

const party=document.getElementById('party');
PERSONAJES.forEach(p=>{
  const el=document.createElement('div'); el.className='hero'; el.dataset.name=p.nombre;
  el.innerHTML=`<img src="${p.img}" alt="${p.nombre}"

  el.addEventListener('click',()=>abrirPersonaje(p));
  party.appendChild(el);
});

const world=document.getElementById('world');
const visitadas=new Set();
PARADAS.forEach(s=>{
  const pin=document.createElement('div');
  pin.className='pin'; pin.style.left=s.x+'%'; pin.style.top=s.y+'%'; pin.dataset.id=s.id;
  pin.innerHTML=`<div class="marker"><div class="head"><span class="num">${s.n}</span></div></div>`;
  pin.querySelector('.marker').addEventListener('click',ev=>{ ev.stopPropagation(); if(dragging) return; abrirParada(s); marcar(s.id); });
  world.appendChild(pin);
});
function marcar(id){visitadas.add(id); const p=[...world.querySelectorAll('.pin')].find(p=>p.dataset.id===id); if(p)p.classList.add('visited');}

/* ======================================================================
   MOTOR PAN / ZOOM
   ====================================================================== */
const vp=document.getElementById('viewport');
const mapImg=document.getElementById('mapImg');
let IMG_W=1024, IMG_H=1280, scale=1, tx=0, ty=0, minScale=1, maxScale=4;

function setWorldSize(){ world.style.width=IMG_W+'px'; world.style.height=IMG_H+'px'; }
setWorldSize();

mapImg.onload=()=>{
  if(!mapImg.naturalWidth) return;                 // 404 o imagen vacía
  IMG_W=mapImg.naturalWidth; IMG_H=mapImg.naturalHeight;
  setWorldSize(); world.classList.remove('nomap'); mapImg.style.display='block';
  fit();
};
mapImg.onerror=()=>{ world.classList.add('nomap'); setWorldSize(); fit(); };
mapImg.src='img/mapa.png';

function fit(){
  const vw=vp.clientWidth, vh=vp.clientHeight;
  minScale=Math.max(vw/IMG_W, vh/IMG_H);   // "cover": llena la pantalla
  if(!isFinite(minScale)||minScale<=0) minScale=1;
  maxScale=minScale*5;
  scale=minScale; tx=(vw-IMG_W*scale)/2; ty=(vh-IMG_H*scale)/2;
  clamp(); apply();
}
function clampScale(s){return Math.max(minScale, Math.min(maxScale, s));}
function clamp(){
  const vw=vp.clientWidth, vh=vp.clientHeight, w=IMG_W*scale, h=IMG_H*scale;
  tx = w<=vw ? (vw-w)/2 : Math.min(0, Math.max(vw-w, tx));
  ty = h<=vh ? (vh-h)/2 : Math.min(0, Math.max(vh-h, ty));
}
function apply(){
  world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  document.documentElement.style.setProperty('--inv', 1/scale);
}
function zoomAt(fx,fy,ns){
  ns=clampScale(ns);
  const wx=(fx-tx)/scale, wy=(fy-ty)/scale;   // punto del mundo bajo el foco
  scale=ns; tx=fx-wx*scale; ty=fy-wy*scale; clamp(); apply();
}

/* --- gestos con Pointer Events --- */
const pts=new Map();
let dragging=false, gStartDist=0, gStartScale=1, gStartMid=null, gStartT=null, single=null;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mid =(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

vp.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ single={x:e.clientX,y:e.clientY,tx,ty}; dragging=false; }
  if(pts.size===2){ const[a,b]=[...pts.values()]; gStartDist=dist(a,b); gStartScale=scale; gStartMid=mid(a,b); gStartT={tx,ty}; }
});
window.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size>=2){
    const[a,b]=[...pts.values()]; const d=dist(a,b), m=mid(a,b);
    const ns=clampScale(gStartScale*d/gStartDist);
    const wx=(gStartMid.x-gStartT.tx)/gStartScale, wy=(gStartMid.y-gStartT.ty)/gStartScale;
    scale=ns; tx=m.x-wx*scale; ty=m.y-wy*scale; clamp(); apply();
    dragging=true; vp.classList.add('grabbing');
  } else if(single){
    const dx=e.clientX-single.x, dy=e.clientY-single.y;
    if(Math.abs(dx)+Math.abs(dy)>6){ dragging=true; vp.classList.add('grabbing'); }
    if(dragging){ tx=single.tx+dx; ty=single.ty+dy; clamp(); apply(); }
  }
},{passive:false});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) gStartMid=null;
  if(pts.size===0){ single=null; vp.classList.remove('grabbing'); setTimeout(()=>dragging=false,0); }
  else if(pts.size===1){ const[p]=[...pts.values()]; single={x:p.x,y:p.y,tx,ty}; }
}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);

// zoom con rueda (escritorio)
vp.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, scale*(e.deltaY<0?1.15:0.87)); },{passive:false});

// botones
document.getElementById('zoomIn').onclick =()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,scale*1.4);
document.getElementById('zoomOut').onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,scale/1.4);
document.getElementById('reset').onclick  =fit;
window.addEventListener('resize',()=>{ clamp(); apply(); });

/* ======================================================================
   MODAL
   ====================================================================== */
const overlay=document.getElementById('overlay');
const headContent=document.getElementById('headContent');
const modalBody=document.getElementById('modalBody');
function abrir(){overlay.classList.add('open'); ping();}
function cerrar(){overlay.classList.remove('open');}
document.getElementById('closeBtn').onclick=cerrar;
overlay.addEventListener('click',e=>{if(e.target===overlay)cerrar();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});

function abrirPersonaje(p){
  headContent.innerHTML=`<h2>${p.emoji} ${p.nombre}</h2><div class="sub">${p.subtitulo}</div>`;
  modalBody.innerHTML=`
    <div class="modal-img"><img src="${p.foto||p.img}" alt="${p.nombre}"
      onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=\\'fb\\'>${p.emoji}</span>');"></div>
    <div class="modal-text">
      <h4>✨ ¿Quién es?</h4><p>${p.descripcion}</p>
      <h4>💚 Le encanta</h4><div class="likes">${p.gustos.map(g=>`<span class="chip">${g}</span>`).join('')}</div>
      <div class="quote">${p.frase}</div>
    </div>`;
  abrir();
}
function abrirParada(s){
  headContent.innerHTML=`<h2><span class="num-badge">${s.n}</span>${s.nombre}</h2><div class="sub">${s.pais}</div>`;
  modalBody.innerHTML=`
    <div class="modal-img"><img src="${s.img}" alt="${s.nombre}"
      onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=\\'fb\\'>${s.emoji}</span>');"></div>
    <div class="modal-text">
      <h4>📖 Un poco de historia</h4><p>${s.historia}</p>
      <h4>🎒 Qué hacer aquí</h4>
      <ul class="acts">${s.actividades.map(a=>`<li><span class="ic">${a[0]}</span><span>${a[1]}</span></li>`).join('')}</ul>
    </div>`;
  abrir();
}

/* sonido */
let sound=true, actx;
const btnSound=document.getElementById('btnSound');
btnSound.onclick=()=>{sound=!sound; btnSound.textContent=sound?'🔊':'🔇';};
function ping(){ if(!sound)return; try{
  actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=660;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(.2,actx.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.25); o.start(); o.stop(actx.currentTime+.26);
}catch(e){} }

/* ocultar pista a los 6s */
setTimeout(()=>{const h=document.getElementById('hint'); if(h)h.style.opacity='0';},6000);

/* calibración */
const calib=document.getElementById('calib'); let calibOn=false;
document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='c'){ calibOn=!calibOn; calib.classList.toggle('on',calibOn); calib.textContent=calibOn?'CALIBRACIÓN: toca el mapa':''; }});
vp.addEventListener('click',e=>{
  if(!calibOn||dragging) return;
  const x=((e.clientX-tx)/scale/IMG_W*100).toFixed(1);
  const y=((e.clientY-ty)/scale/IMG_H*100).toFixed(1);
  calib.textContent=`x:${x}  y:${y}`;
});

fit();

/* splash + pantalla de carga con barra simulada (~5s) */
const splash=document.getElementById('splash');
const loading=document.getElementById('loading');
const loadFill=document.getElementById('loadFill');
const loadPct=document.getElementById('loadPct');
const loadMsg=document.getElementById('loadMsg');
const LOAD_MSGS=['Desplegando el mapa 🗺️','Inflando las ruedas 🚐','Preparando la mochila 🎒','Colocando las chinchetas 📍','¡Casi listos! ✨'];

document.getElementById('startBtn').addEventListener('click',()=>{
  ping(); splash.classList.add('hide');
  setTimeout(()=>{ splash.style.display='none'; runLoading(); },500);
});

function runLoading(){
  loading.style.display='flex';
  const dur=5000, t0=performance.now();
  (function step(t){
    const p=Math.min(1,(t-t0)/dur);
    loadFill.style.width=(p*100).toFixed(1)+'%';
    loadPct.textContent=Math.floor(p*100)+'%';
    loadMsg.textContent=LOAD_MSGS[Math.min(LOAD_MSGS.length-1,Math.floor(p*LOAD_MSGS.length))];
    if(p<1) requestAnimationFrame(step);
    else { ping(); setTimeout(()=>{ loading.classList.add('hide'); setTimeout(()=>loading.style.display='none',650); },300); }
  })(t0);
}
</script>
